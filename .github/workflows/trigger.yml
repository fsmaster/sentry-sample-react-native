name: trigger

# Started by the playground dashboard (or by hand from the Actions tab).
# Release build uploads the JS bundle + source map, then the app runs on an
# emulator and sends one error.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "id that goes into the event (tag + fingerprint)"
        default: "manual"
      fresh:
        description: "new issue for this run"
        default: "true"
  push:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      RUN_ID: ${{ inputs.run_id || format('push-{0}', github.run_number) }}
      FRESH: ${{ inputs.fresh || 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK (uploads source map to Sentry)
        working-directory: android
        run: ./gradlew assembleRelease --console=plain -PreactNativeArchitectures=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -a android.intent.action.VIEW -d "'sentrysample://run?id=$RUN_ID&fresh=$FRESH'" com.sentrysample
            sleep 20
            adb logcat -d | grep SentrySample || true
